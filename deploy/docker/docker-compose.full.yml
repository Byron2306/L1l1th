# LILITH ETERNAL - Full Docker Compose
# =====================================
# Complete deployment with:
# - Ollama (text chat - dolphin-mistral uncensored)
# - Stable Diffusion (image generation - free, local)
# - Wav2Lip (lip-sync animation)
# - LILITH Web Server
#
# Requirements: NVIDIA GPU with 8GB+ VRAM recommended
# =====================================

version: '3.8'

services:
  # =========================================
  # OLLAMA - Local Text AI
  # =========================================
  ollama:
    image: ollama/ollama:latest
    container_name: lilith-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # =========================================
  # MODEL LOADER - Downloads AI models
  # =========================================
  model-loader:
    image: ollama/ollama:latest
    container_name: lilith-model-loader
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=========================================="
        echo "  Downloading dolphin-mistral:7b..."
        echo "=========================================="
        sleep 5
        ollama pull dolphin-mistral:7b
        echo "Model ready!"
    restart: "no"

  # =========================================
  # STABLE DIFFUSION - Local Image Generation
  # =========================================
  stable-diffusion:
    image: universonic/stable-diffusion-webui:latest
    container_name: lilith-stable-diffusion
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      - sd_models:/data/models
      - sd_outputs:/data/outputs
      - ./sd_config:/data/config
    environment:
      - COMMANDLINE_ARGS=--api --listen --no-half-vae --enable-insecure-extension-access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/sdapi/v1/sd-models"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

  # =========================================
  # WAV2LIP - Lip Sync Service
  # =========================================
  wav2lip:
    image: hxcan/wav2lip-service:latest
    container_name: lilith-wav2lip
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - wav2lip_data:/app/data
      - ./avatars:/app/avatars
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =========================================
  # LILITH ETERNAL - Main Web Interface
  # =========================================
  lilith:
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: lilith-eternal
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./avatars:/app/avatars
      - lilith_data:/app/data
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=dolphin-mistral:7b
      - SD_URL=http://stable-diffusion:7860
      - WAV2LIP_URL=http://wav2lip:5000
      - PORT=5000
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
  sd_models:
  sd_outputs:
  wav2lip_data:
  lilith_data:

networks:
  default:
    name: lilith-network
