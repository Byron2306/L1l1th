# LILITH ETERNAL - Docker Compose
# Complete deployment with Ollama and LILITH server

version: '3.8'

services:
  # Ollama - Local AI Model Server
  ollama:
    image: ollama/ollama:latest
    container_name: lilith-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
    deploy:
      resources:
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Model Loader - Downloads the AI model on first start
  model-loader:
    image: ollama/ollama:latest
    container_name: lilith-model-loader
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to be ready..."
        sleep 5
        echo "Pulling dolphin-mistral:7b (uncensored)..."
        ollama pull dolphin-mistral:7b
        echo "Model downloaded successfully!"
    restart: "no"

  # LILITH ETERNAL - Web Interface
  lilith:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lilith-eternal
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=dolphin-mistral:7b
      - PORT=5000
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
    driver: local

networks:
  default:
    name: lilith-network
